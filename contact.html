<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Contact Muthiah Shanmugam for professional inquiries or collaboration opportunities.">
  <title>Contact | Muthiah Shanmugam</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <header>
    <h1>Muthiah Shanmugam</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="experience.html">Experience</a>
      <a href="publications.html">Publications</a>
      <a href="hobbies.html">Hobbies</a>
      <a href="contact.html">Contact</a>
    </nav>
    <div class="lang-switch">
      <a href="contact.html" class="active">EN</a>
      <a href="de/contact.html">DE</a>
    </div>
  </header>

  <main>
    <h2>Contact Me</h2>
    <p>
      I'm happy to connect regarding professional inquiries or collaboration opportunities.
      Send me a direct message through the form below.
    </p>

    <h2>Send a Message</h2>
    <form action="https://formspree.io/f/mnqvylwj" method="POST">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" required>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>

      <label for="message">Message</label>
      <textarea id="message" name="message" rows="5" required></textarea>

      <button type="submit">Send Message</button>
    </form>
  </main>

  <footer>
    &copy; 2026 Muthiah Shanmugam | Built with ❤️ on GitHub Pages
  </footer>

  <script>
    (function () {
      var page = location.pathname.split('/').pop() || 'index.html';
      document.querySelectorAll('nav a').forEach(function (a) {
        if (a.getAttribute('href') === page) a.classList.add('active');
      });
    })();
  </script>

</body>
</html>
